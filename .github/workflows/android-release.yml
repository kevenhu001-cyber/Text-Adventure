name: Android Release

# 推 tag（v*）自动发版；也可以在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号，例如 v1.0.0。留空则生成 v0.0.0-build 预览包'
        required: false
        default: ''
      run_tests:
        description: '发版前是否跑单元测试'
        type: boolean
        default: true
      draft:
        description: '创建为草稿 Release（不立即公开）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: 构建签名 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          # 发版说明要取 tag 之间的提交记录，需要完整历史
          fetch-depth: 0

      - name: 配置 JDK 17
        # AGP 8.13.x 要求 JDK 17 及以上
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Android SDK 并安装组件
        # ubuntu-latest 自带 commandline-tools，不使用 android-actions/setup-android：
        # 该动作会尝试安装已被 Google 移除的 'tools' 包，导致 sdkmanager 退出码 1。
        #
        # 注意 ANDROID_SDK_ROOT 与 ANDROID_HOME 必须在这里一次性设全并导出：
        # 早先只设了 ANDROID_HOME，下一步读 ANDROID_SDK_ROOT 得到空串，glob 匹配不到 sdkmanager。
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager \
            "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager \
            "$SDK_ROOT"/tools/bin/sdkmanager; do
            if [ -x "$candidate" ] || [ -f "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::在 $SDK_ROOT 下找不到 sdkmanager"
            find "$SDK_ROOT" -maxdepth 3 -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          # runner 镜像里的 sdkmanager 已经可执行，且 SDK 目录属 root，
          # chmod 会报 "Operation not permitted" 并在 set -e 下中断，所以这里容错处理。
          chmod +x "$SDKMANAGER" 2>/dev/null || true
          echo "使用 sdkmanager: $SDKMANAGER"

          # 许可需在安装组件之前接受，否则 sdkmanager 会拒绝继续
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK 组件安装完成"

      - name: 解析版本号
        id: version
        run: |
          set -euo pipefail
          RAW='${{ github.event.inputs.tag }}'
          if [ -z "$RAW" ]; then
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$RAW" ] || [ "$RAW" = "refs/heads/main" ]; then
            RAW="v0.0.0-build.${GITHUB_RUN_NUMBER}"
          fi
          NAME="${RAW#v}"
          # versionCode = major*10000 + minor*100 + patch，保证随版本单调递增
          MAJOR=$(echo "$NAME" | cut -d. -f1 | tr -cd '0-9'); MAJOR=${MAJOR:-0}
          MINOR=$(echo "$NAME" | cut -d. -f2 | tr -cd '0-9'); MINOR=${MINOR:-0}
          PATCH=$(echo "$NAME" | cut -d. -f3 | tr -cd '0-9'); PATCH=${PATCH:-0}
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          [ "$CODE" -lt 1 ] && CODE=1
          echo "tag=$RAW"        >> "$GITHUB_OUTPUT"
          echo "name=$NAME"      >> "$GITHUB_OUTPUT"
          echo "code=$CODE"      >> "$GITHUB_OUTPUT"
          echo "版本 $NAME (versionCode=$CODE)"

      - name: 还原签名密钥
        # Secrets 命名上兼容两种写法：
        #   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD（仓库里已配的）
        #   KEYSTORE_BASE64 / KEYSTORE_PASSWORD（README 文档里写的）
        # 两者配任意一组即可。
        #
        # KEY_ALIAS 缺省时用 keytool 从 keystore 里读第一个别名；
        # KEY_PASSWORD 缺省时复用 store 密码（最常见的情况）。
        # 这样只配两个 Secret 也能直接出包，不必强行凑齐四个。
        #
        # 绝不在 CI 里临时生成密钥：每次构建签名密钥都不同的话，
        # Android 不允许用不同密钥覆盖安装，用户的应用会装不上去。
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          B64="${ANDROID_KEYSTORE_BASE64:-$KEYSTORE_BASE64}"
          STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-$KEYSTORE_PASSWORD}"

          if [ -z "$B64" ] || [ -z "$STORE_PASS" ]; then
            echo "::error::缺少 keystore 凭据。需要下列任意一组："
            echo "::error::  ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD"
            echo "::error::  或 KEYSTORE_BASE64 + KEYSTORE_PASSWORD"
            echo "::error::请在 Settings → Secrets and variables → Actions 中补齐后重跑。"
            exit 1
          fi

          echo "$B64" | base64 --decode > release.jks
          if [ ! -s release.jks ]; then
            echo "::error::keystore 解码失败，请检查 Base64 内容是否完整"
            exit 1
          fi

          ALIAS="${KEY_ALIAS:-}"
          if [ -z "$ALIAS" ]; then
            # 从 keystore 中读出第一个别名
            ALIAS=$(keytool -list -keystore release.jks -storepass "$STORE_PASS" 2>/dev/null \
                    | grep -oE 'Alias name: .*' | head -1 | sed 's/^Alias name: //' || true)
          fi
          if [ -z "$ALIAS" ]; then
            echo "::error::无法确定 keystore 别名。请手动添加 Secret: KEY_ALIAS"
            keytool -list -keystore release.jks -storepass "$STORE_PASS" 2>&1 | head -20 || true
            exit 1
          fi

          # key 密码默认与 store 密码一致
          KEY_PASS="${KEY_PASSWORD:-$STORE_PASS}"

          # 用 printf 而非 heredoc：YAML run 块里的缩进会让 <<EOF 终止符无法匹配
          printf 'storeFile=release.jks\nkeyAlias=%s\nstorePassword=%s\nkeyPassword=%s\n' \
            "$ALIAS" "$STORE_PASS" "$KEY_PASS" > key.properties

          echo "别名: $ALIAS"
          [ -n "$KEY_PASSWORD" ] && echo "key 密码: 已单独提供" || echo "key 密码: 复用 store 密码"
          echo "签名密钥已就绪"

      - name: 单元测试
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests == 'true' || github.event_name == 'push' }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: 构建 Release APK
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: 收集产物
        id: collect
        run: |
          set -euo pipefail
          chmod +x gradlew || true
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::没有找到 release APK"
            ls -R app/build/outputs || true
            exit 1
          fi
          OUT="Text-Adventure-${{ steps.version.outputs.tag }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$OUT" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "产物：$OUT ($(du -h "$OUT" | cut -f1))"

      - name: 上传 Actions 构件
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.tag }}
          path: ${{ steps.collect.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: 生成发版说明
        run: |
          set -euo pipefail
          TAG='${{ steps.version.outputs.tag }}'
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            NOTES=$(git log --pretty=format:'* %s (%h)' "$PREV..$TAG" 2>/dev/null || true)
          else
            # 首个版本没有上一个 tag，列出到该 tag 为止的最近 30 条提交
            NOTES=$(git log --pretty=format:'* %s (%h)' -n 30 "$TAG" 2>/dev/null || true)
          fi
          [ -z "$NOTES" ] && NOTES="* 首次发布"
          {
            echo "## 神秘之旅 ${TAG}"
            echo
            echo "$NOTES"
            echo
            echo "---"
            echo "安装包：\`Text-Adventure-${TAG}.apk\`（minSdk 26 / Android 8.0 及以上）"
            echo
            echo "> 本作为《诡秘之主》同人作品，设定与文本版权归原作者及权利人所有。"
          } > release-notes.md
          cat release-notes.md

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          DRAFT: ${{ inputs.draft || false }}
        run: |
          set -euo pipefail
          # 同名 Release 已存在时先删掉标签再重建，保证重跑是幂等的
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi
          gh release create "$TAG" \
            --title "神秘之旅 $TAG" \
            --notes-file release-notes.md \
            ${{ inputs.draft && '--draft' || '' }} \
            "${{ steps.collect.outputs.path }}"

      - name: 输出下载链接
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "### 🎉 发布完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "版本 \`$TAG\` · 体积 ${{ steps.collect.outputs.size }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "下载地址：${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
