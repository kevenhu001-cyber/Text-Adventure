name: Android Release

# 推 tag（v*）自动发版；也可以在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号，例如 v1.0.0。留空则生成 v0.0.0-build 预览包'
        required: false
        default: ''
      run_tests:
        description: '发版前是否跑单元测试'
        type: boolean
        default: true
      draft:
        description: '创建为草稿 Release（不立即公开）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: 构建签名 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          # 发版说明要取 tag 之间的提交记录，需要完整历史
          fetch-depth: 0

      - name: 配置 JDK 17
        # AGP 8.13.x 要求 JDK 17 及以上
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 SDK 许可并安装所需组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: 解析版本号
        id: version
        run: |
          set -euo pipefail
          RAW='${{ github.event.inputs.tag }}'
          if [ -z "$RAW" ]; then
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$RAW" ] || [ "$RAW" = "refs/heads/main" ]; then
            RAW="v0.0.0-build.${GITHUB_RUN_NUMBER}"
          fi
          NAME="${RAW#v}"
          # versionCode = major*10000 + minor*100 + patch，保证随版本单调递增
          MAJOR=$(echo "$NAME" | cut -d. -f1 | tr -cd '0-9'); MAJOR=${MAJOR:-0}
          MINOR=$(echo "$NAME" | cut -d. -f2 | tr -cd '0-9'); MINOR=${MINOR:-0}
          PATCH=$(echo "$NAME" | cut -d. -f3 | tr -cd '0-9'); PATCH=${PATCH:-0}
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          [ "$CODE" -lt 1 ] && CODE=1
          echo "tag=$RAW"        >> "$GITHUB_OUTPUT"
          echo "name=$NAME"      >> "$GITHUB_OUTPUT"
          echo "code=$CODE"      >> "$GITHUB_OUTPUT"
          echo "版本 $NAME (versionCode=$CODE)"

      - name: 还原签名密钥
        # 缺少密钥就直接失败并给出补救指引。
        # 绝不在 CI 里临时生成密钥：那样每次构建签名密钥都不同，
        # Android 不允许用不同密钥覆盖安装，用户的应用会装不上去。
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 Secrets：$missing"
            echo "::error::请在 Settings → Secrets and variables → Actions 中补齐后重跑。"
            echo "::error::生成方式见仓库 README 的「发布 Release」一节。"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          # 用 printf 而非 heredoc：YAML run 块里的缩进会让 <<EOF 终止符无法匹配
          printf 'storeFile=release.jks\nkeyAlias=%s\nstorePassword=%s\nkeyPassword=%s\n' \
            "$KEY_ALIAS" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" > key.properties
          echo "签名密钥已还原"

      - name: 单元测试
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests == 'true' || github.event_name == 'push' }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: 构建 Release APK
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: 收集产物
        id: collect
        run: |
          set -euo pipefail
          chmod +x gradlew || true
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::没有找到 release APK"
            ls -R app/build/outputs || true
            exit 1
          fi
          OUT="Text-Adventure-${{ steps.version.outputs.tag }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$OUT" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "产物：$OUT ($(du -h "$OUT" | cut -f1))"

      - name: 上传 Actions 构件
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.tag }}
          path: ${{ steps.collect.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: 生成发版说明
        run: |
          set -euo pipefail
          TAG='${{ steps.version.outputs.tag }}'
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            NOTES=$(git log --pretty=format:'* %s (%h)' "$PREV..$TAG" 2>/dev/null || true)
          else
            # 首个版本没有上一个 tag，列出到该 tag 为止的最近 30 条提交
            NOTES=$(git log --pretty=format:'* %s (%h)' -n 30 "$TAG" 2>/dev/null || true)
          fi
          [ -z "$NOTES" ] && NOTES="* 首次发布"
          {
            echo "## 神秘之旅 ${TAG}"
            echo
            echo "$NOTES"
            echo
            echo "---"
            echo "安装包：\`Text-Adventure-${TAG}.apk\`（minSdk 26 / Android 8.0 及以上）"
            echo
            echo "> 本作为《诡秘之主》同人作品，设定与文本版权归原作者及权利人所有。"
          } > release-notes.md
          cat release-notes.md

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          DRAFT: ${{ inputs.draft || false }}
        run: |
          set -euo pipefail
          # 同名 Release 已存在时先删掉标签再重建，保证重跑是幂等的
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi
          gh release create "$TAG" \
            --title "神秘之旅 $TAG" \
            --notes-file release-notes.md \
            ${{ inputs.draft && '--draft' || '' }} \
            "${{ steps.collect.outputs.path }}"

      - name: 输出下载链接
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "### 🎉 发布完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "版本 \`$TAG\` · 体积 ${{ steps.collect.outputs.size }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "下载地址：${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
